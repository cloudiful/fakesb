[package]
name = "fakESB"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"

[workspace]
members = ["crates/xml"]

[dependencies]
actix-web = { version = "4.14.0", features = ["rustls-0_23"] }
cloudiful-config = { package = "cloudiful-config", version = "0.6.3" }
cloudiful-server = { package = "cloudiful-server", version = "0.2.7", features = ["actix"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
log = "0.4.33"
log4rs = "1.4.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "macros", "migrate"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
utoipa = { version = "5.5.0", features = ["chrono"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
url = "2.5.7"
xml = { path = "crates/xml" }
