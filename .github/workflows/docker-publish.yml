name: Release Binaries and Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PUBLISH_IMAGES: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-binaries:
    name: Build ${{ matrix.target }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            binary_name: fakESB.exe
            release_suffix: .exe
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SQLX_OFFLINE: "true"
      TARGET: ${{ matrix.target }}
      BINARY_NAME: ${{ matrix.binary_name || 'fakESB' }}
      RELEASE_BINARY: fakesb-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'manual' }}-${{ matrix.target }}${{ matrix.release_suffix || '' }}
      RELEASE_CHECKSUM: fakesb-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'manual' }}-${{ matrix.target }}${{ matrix.release_suffix || '' }}.sha256
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0

      - name: Build binary
        working-directory: server
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: cargo build --release --target "${{ matrix.target }}" --bin fakESB

      - name: Show sccache stats
        if: always()
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: sccache --show-stats

      - name: Validate binary
        shell: bash
        run: |
          set -euo pipefail
          binary="server/target/${TARGET}/release/${BINARY_NAME}"
          test -s "${binary}"
          size="$(wc -c < "${binary}")"
          case "${TARGET}" in
            x86_64-unknown-linux-gnu)
              file "${binary}" | grep -Eqi 'ELF 64-bit.*x86-64'
              ;;
            aarch64-unknown-linux-gnu)
              file "${binary}" | grep -Eqi 'ELF 64-bit.*(aarch64|ARM)'
              ;;
            aarch64-apple-darwin)
              file "${binary}" | grep -Eqi 'Mach-O 64-bit.*arm64'
              ;;
            x86_64-pc-windows-msvc)
              test "${RUNNER_OS}" = "Windows"
              case "${BINARY_NAME}" in
                *.exe) ;;
                *) echo "Windows binary must have an .exe suffix" >&2; exit 1 ;;
              esac
              ;;
            *)
              echo "unsupported target: ${TARGET}" >&2
              exit 1
              ;;
          esac
          echo "${binary} size=${size} bytes"
          cp "${binary}" "${RELEASE_BINARY}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${RELEASE_BINARY}" > "${RELEASE_CHECKSUM}"
          else
            shasum -a 256 "${RELEASE_BINARY}" > "${RELEASE_CHECKSUM}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ env.RELEASE_BINARY }}
            ${{ env.RELEASE_CHECKSUM }}
          if-no-files-found: error
          retention-days: 7

  build-image-inputs:
    name: Build static frontend input
    needs: build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BINARY_ASSET: fakesb-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'manual' }}-x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download amd64 binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: binary-artifact

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Restore Bun cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/package.json', 'web/bunfig.toml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --no-save --minimum-release-age 604800

      - name: Prepare binary input
        shell: bash
        run: chmod +x "binary-artifact/${BINARY_ASSET}"

      - name: Export OpenAPI
        run: |
          "binary-artifact/${BINARY_ASSET}" export-openapi > web/openapi.json

      - name: Generate frontend
        working-directory: web
        run: |
          bunx openapi-typescript openapi.json -o types/api.generated.ts
          bun run generate
          test -f .output/public/index.html
          mkdir -p ../ci-image-input/frontend-dist
          cp -R .output/public/. ../ci-image-input/frontend-dist/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: ci-image-input/frontend-dist
          if-no-files-found: error
          retention-days: 7

  build-images:
    name: Build and publish ${{ matrix.arch }} image
    needs: build-image-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'manual' }}-${{ matrix.arch }}
      LATEST_TAG: latest-${{ matrix.arch }}
      BINARY_ASSET: fakesb-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'manual' }}-${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download frontend artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-dist
          path: ci-image-input/frontend-dist

      - name: Download target binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: binary-${{ matrix.target }}
          path: binary-artifact

      - name: Prepare Docker input directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-image-input/app/bin
          install -Dm755 "binary-artifact/${BINARY_ASSET}" ci-image-input/app/bin/fakESB

      - name: Log in to GHCR
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and publish image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: prebuilt-runtime
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
          cache-from: type=gha,scope=fakesb-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fakesb-${{ matrix.arch }}

  publish-manifest:
    name: Publish multi-architecture manifests
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Publish version and latest manifests
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${{ github.ref_name }}" \
            "${IMAGE_NAME}:${{ github.ref_name }}-amd64" \
            "${IMAGE_NAME}:${{ github.ref_name }}-arm64"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:latest-amd64" \
            "${IMAGE_NAME}:latest-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${{ github.ref_name }}"

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Verify binaries
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          for checksum in fakesb-${{ github.ref_name }}-*.sha256; do
            test -f "${checksum}"
            binary="${checksum%.sha256}"
            test -f "${binary}"
            sha256sum -c "${checksum}"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/fakesb-${{ github.ref_name }}-*
